name: TDDaaS Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tddaas:
    name: Repository Quality Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run repository quality tests
        shell: bash
        run: |
          set -euo pipefail
          pytest quality_tests \
            --cov=quality_tests \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
